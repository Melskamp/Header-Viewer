<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Message Header Viewer</title>

<script src="https://appsforoffice.microsoft.com/lib/1/hosted/Office.js"></script>

<style>
:root {
  --bg: #0f1115;
  --surface: #1a1d23;
  --rowA: #16191f;
  --rowB: #1e2229;
  --border: #2b2f36;
  --text: #e6e6e6;
  --muted: #a8a8a8;
  --accent: #5aa9ff;
  --highlight: #ffeb3b;
}

body {
  margin: 10px;
  font-family: Segoe UI, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
}

header {
  font-weight: 600;
  margin-bottom: 10px;
  font-size: 15px;
}

.toolbar {
  margin-bottom: 10px;
}

button {
  padding: 6px 12px;
  margin-right: 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}

button:hover {
  background: #252a33;
}

.status {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
}

#output {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow-y: auto;
  max-height: 65vh;
  min-height: 120px;
}

/* Header rows */
.header-row {
  padding: 6px 10px;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: Consolas, monospace;
  line-height: 1.35;
}

.row-a { background: var(--rowA); }
.row-b { background: var(--rowB); }

.header-name {
  color: var(--accent);
  font-weight: 600;
}

mark {
  background: var(--highlight);
  color: #000;
  padding: 0 2px;
  border-radius: 2px;
}

/* Settings */
#settingsPanel {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #14171c;
}

.hidden { display: none; }

textarea {
  width: 100%;
  height: 90px;
  margin-top: 6px;
  padding: 8px;
  border-radius: 6px;
  background: #0c0f13;
  color: var(--text);
  border: 1px solid var(--border);
  font-family: Consolas, monospace;
}
</style>
</head>

<body>

<header>Message Header Viewer</header>

<div class="toolbar">
  <button id="btnRefresh">Refresh</button>
  <button id="btnSettings">Settings</button>
</div>

<div id="status" class="status">
  Select a message and click Refresh.
</div>

<div id="output">(no headers loaded)</div>

<div id="settingsPanel" class="hidden">
  <div>Highlight words (one per line)</div>
  <textarea id="wordsBox"></textarea>

  <div style="margin-top:6px;">
    <button id="btnSaveSettings">Save</button>
    <button id="btnCloseSettings">Close</button>
  </div>

  <div id="settingsStatus" class="status"></div>
</div>

<script src="./taskpane.js"></script>

</body>
</html>
