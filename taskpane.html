<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Message Header Viewer</title>

  <!-- REQUIRED: Office.js must be loaded from the official CDN -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/Office.js"></script>

  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      margin: 10px;
      font-size: 13px;
    }

    header {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .toolbar {
      margin-bottom: 8px;
    }

    button {
      padding: 4px 10px;
      margin-right: 6px;
      border-radius: 4px;
      border: 1px solid #888;
      background: #f5f5f5;
      cursor: pointer;
    }

    button:hover {
      background: #eaeaea;
    }

    .status {
      margin: 6px 0;
      color: #555;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    textarea {
      width: 100%;
      height: 80px;
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #0d0d0d;
      color: #f1f1f1;
      padding: 8px;
      border-radius: 4px;
      max-height: 55vh;
      overflow-y: auto;
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    mark {
      background: #ffeb3b;
      color: #000;
      padding: 0 2px;
      border-radius: 2px;
    }

    .section {
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>Message Header Viewer</header>

  <div class="toolbar">
    <button id="btnRefresh">Refresh Headers</button>
    <button id="btnSettings">Settings</button>
  </div>

  <div id="status" class="status">Select a message and click “Refresh Headers”.</div>

  <!-- Header output -->
  <pre id="output">(no headers loaded)</pre>

  <!-- Settings panel -->
  <div id="settingsPanel" class="section hidden">
    <div><strong>Highlight words</strong> (one per line)</div>
    <textarea id="wordsBox" placeholder="spf\ndkim\ndmarc"></textarea>
    <div style="margin-top:6px;">
      <button id="btnSaveSettings">Save</button>
      <button id="btnCloseSettings">Close</button>
    </div>
    <div id="settingsStatus" class="status"></div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
