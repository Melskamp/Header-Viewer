<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message Header Viewer</title>

  <!-- REQUIRED: Office.js from Microsoft's CDN -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/Office.js"></script>

  <style>
    :root {
      --bg: #0f0f10;
      --panel: #141416;
      --panel2: #1c1c1f;
      --border: #2a2a2e;
      --text: #eaeaea;
      --muted: #b5b5b5;
      --accent: #3aa0ff;
      --btn: #202024;
      --btnHover: #2a2a30;
      --mark: #ffeb3b;
    }

    body {
      margin: 10px;
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
    }

    header {
      font-weight: 650;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(58,160,255,.65);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    button {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }
    button:hover { background: var(--btnHover); }
    button:active { transform: translateY(1px); }

    .status {
      margin: 8px 2px 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .hidden { display: none; }

    /* Output container */
    #output {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Collapsible sections */
    .section {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      background: var(--panel2);
    }

    .section-header:hover {
      filter: brightness(1.06);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 650;
    }

    .caret {
      width: 0;
      height: 0;
      border-left: 6px solid var(--muted);
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      transition: transform .12s ease;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .section-body {
      display: none;
      padding: 10px;
      background: var(--panel);
    }

    .section-body.open {
      display: block;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text);
    }

    mark {
      background: var(--mark);
      color: #000;
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Settings panel */
    #settingsPanel {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      padding: 10px;
    }

    #settingsPanel .hint {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 110px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0b0c;
      color: var(--text);
      padding: 8px;
      font-family: Consolas, ui-monospace, monospace;
      font-size: 12px;
      resize: vertical;
      box-sizing: border-box;
    }

    .settings-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .kbd {
      font-family: Consolas, ui-monospace, monospace;
      font-size: 12px;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #0b0b0c;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <header>
    <span class="dot" aria-hidden="true"></span>
    <span>Message Header Viewer</span>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Header viewer actions">
    <button id="btnRefresh" type="button">Refresh Headers</button>
    <button id="btnExpandAll" type="button">Expand All</button>
    <button id="btnCollapseAll" type="button">Collapse All</button>
    <button id="btnSettings" type="button">Settings</button>
  </div>

  <div id="status" class="status">
    Select a message (Reading Pane on), then choose <span class="kbd">Refresh Headers</span>.
  </div>

  <div id="output">(no headers loaded)</div>

  <div id="settingsPanel" class="hidden" aria-label="Settings">
    <div class="hint">
      Highlight words (one per line). These are saved per-user in Outlook roaming settings.
    </div>
    <textarea id="wordsBox" placeholder="spf&#10;dkim&#10;dmarc"></textarea>

    <div class="settings-actions">
      <button id="btnSaveSettings" type="button">Save</button>
      <button id="btnCloseSettings" type="button">Close</button>
    </div>

    <div id="settingsStatus" class="status"></div>
  </div>

  <script src="./taskpane.js"></script>
</body>
</html>
